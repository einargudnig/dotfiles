# Emeraldian — terminal UI for Obsidian vaults.
# https://github.com/iamrohithrnair/emeraldian
#
# Theme: Catppuccin Macchiato (built-in).
# Note: Emeraldian reads this config file, state.json and auth.json from the
# same directory. It does not currently read Obsidian's Templates plugin
# configuration; templates are still managed inside the vault by Obsidian.
# See personal/obsidian/second-brain/.obsidian/templates.json

theme = "catppuccin-macchiato"

[ui]
sidebar_width = 30
right_sidebar_width = 32
chat_width = 46
show_left_sidebar = true
show_right_sidebar = true
show_chat = false
show_ribbon = true
show_hints = true
show_hidden = false
line_numbers = true
reading_mode = true
sort_order = "modified"

[editor]
tab_width = 4
expand_tabs = true
wrap = true
vim = true
auto_save = true
new_note_folder = ""
daily_folder = "Daily"
daily_format = "%Y-%m-%d"

[graph]
show_unresolved = true
show_tags = false
show_attachments = false
show_orphans = true
show_labels = true
local_depth = 1

[images]
enabled = true
max_height_percent = 66
protocol = "auto"

[agent]
provider = "anthropic"
model = ""
max_tokens = 16000
effort = "high"
show_reasoning = true
allow_writes = true
include_active_note = true
max_tool_rounds = 12
